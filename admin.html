<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" name="viewport"/>
  <title>M&MESTATE - Admin Authentication Gate</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <style>
    /* Mobile input zoom prevention & luxury touch targets */
    @media screen and (max-width: 1024px) {
      input, select, textarea {
        font-size: 16px !important;
        min-height: 48px !important;
      }
      button {
        min-height: 48px !important;
      }
    }

    /* Ambient floating background orb animations */
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-30px, 40px) scale(1.1); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(40px, -30px) scale(1.15); }
    }
    .orb-1 {
      animation: floatOrb1 10s ease-in-out infinite;
    }
    .orb-2 {
      animation: floatOrb2 12s ease-in-out infinite;
    }

    /* Card Entrance Animation */
    @keyframes cardIn {
      0% {
        opacity: 0;
        transform: translateY(20px) scale(0.97);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .animate-card-entry {
      animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Shake Animation for Wrong Password */
    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-9px); }
      40%, 80% { transform: translateX(9px); }
    }
    .shake-anim {
      animation: shakeError 0.45s ease-in-out;
    }

    /* Gradient Shimmer on Button */
    .btn-shimmer {
      background-size: 200% auto;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-shimmer:hover {
      background-position: right center;
      transform: translateY(-1px);
    }
    .btn-shimmer:active {
      transform: scale(0.98);
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#F5F3FF',
              500: '#8B5CF6',
              600: '#7C3AED',
              700: '#6D28D9',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-purple-950 to-slate-900 font-sans text-slate-800 antialiased relative overflow-hidden">

  <!-- Glowing Floating Background Ambient Orbs -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <div class="absolute -top-32 -right-32 w-96 h-96 bg-brand-500/25 rounded-full blur-3xl orb-1"></div>
    <div class="absolute -bottom-32 -left-32 w-96 h-96 bg-emerald-500/20 rounded-full blur-3xl orb-2"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-purple-600/10 rounded-full blur-3xl pointer-events-none"></div>
  </div>

  <!-- Login Card (Protected Authentication Box) -->
  <div id="loginCard" class="w-full max-w-md bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/20 p-7 sm:p-9 relative z-10 animate-card-entry">
    
    <!-- Brand Header -->
    <div class="flex flex-col items-center mb-6 text-center">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-brand-700 to-purple-500 flex items-center justify-center text-white font-black text-2xl shadow-xl shadow-brand-500/30 mb-3.5 transform hover:scale-105 transition-transform duration-300">
        M
      </div>
      <h1 class="text-2xl font-black tracking-tight text-slate-900">M&amp;MESTATE Admin</h1>
      <p class="text-xs text-slate-500 mt-1 font-medium">Authentication required to manage properties</p>
      <div class="mt-2 inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-50 border border-amber-200 text-amber-800 text-[11px] font-semibold">
        <span>🔒 Secure Admin Area</span>
      </div>
    </div>

    <!-- ERROR MESSAGE ALERT -->
    <div id="errorAlert" class="hidden mb-5 p-3.5 bg-rose-50 border-2 border-rose-300 rounded-2xl text-rose-700 text-xs font-semibold flex items-center gap-2.5 transition-all duration-200">
      <svg class="w-5 h-5 shrink-0 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span id="errorMessage">Incorrect User ID or Password. Please try again!</span>
    </div>

    <!-- Login Form -->
    <form id="loginForm" autocomplete="off" class="space-y-4" onsubmit="doLogin(event)">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">User ID</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <input id="userIdInput" 
                 type="text" 
                 autocomplete="off" 
                 spellcheck="false" 
                 data-lpignore="true" 
                 required 
                 placeholder="Enter User ID" 
                 class="w-full pl-10 pr-3.5 py-3 text-sm bg-slate-50 border border-slate-200 rounded-2xl focus:bg-white focus:ring-2 focus:ring-brand-600 focus:border-brand-600 outline-none transition-all duration-200 shadow-2xs"/>
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Password</label>
          <span class="text-[11px] text-slate-400">Click 👁️ to toggle</span>
        </div>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <input id="passwordInput" 
                 type="password" 
                 autocomplete="new-password" 
                 spellcheck="false" 
                 data-lpignore="true" 
                 required 
                 placeholder="Enter Password" 
                 class="w-full pl-10 pr-12 py-3 text-sm bg-slate-50 border border-slate-200 rounded-2xl focus:bg-white focus:ring-2 focus:ring-brand-600 focus:border-brand-600 outline-none transition-all duration-200 shadow-2xs"/>
          <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-brand-600 focus:outline-none transition-colors cursor-pointer" title="Show or Hide Password">
            <span id="eyeIcon" class="text-sm select-none">👁️</span>
          </button>
        </div>
      </div>

      <button id="loginBtn" 
              type="submit" 
              class="btn-shimmer w-full mt-3 py-3.5 px-4 bg-gradient-to-r from-brand-600 via-purple-600 to-brand-700 hover:from-brand-700 hover:to-purple-700 text-white font-bold text-sm tracking-wide rounded-2xl shadow-lg shadow-brand-500/30 transition-all flex items-center justify-center gap-2 cursor-pointer">
        <span id="btnText">Sign In to Admin Panel</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-slate-100 text-center">
      <a href="index.html" class="text-xs font-semibold text-slate-500 hover:text-brand-600 transition flex items-center justify-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Back to Public Website</span>
      </a>
    </div>
  </div>

  <script>
    const VALID_USER_ID = "1963";
    const VALID_PASSWORD = "Rajani08";

    // Clear any stale session credentials when landing on the login page
    sessionStorage.removeItem("mmestate_admin_token");
    sessionStorage.removeItem("mmestate_admin_time");
    localStorage.removeItem("mmestate_admin_authenticated");

    function togglePasswordVisibility() {
      const input = document.getElementById("passwordInput");
      const icon = document.getElementById("eyeIcon");
      if (input.type === "password") {
        input.type = "text";
        icon.innerText = "🙈";
      } else {
        input.type = "password";
        icon.innerText = "👁️";
      }
    }

    function doLogin(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      const userId = (document.getElementById("userIdInput").value || "").trim();
      const password = (document.getElementById("passwordInput").value || "").trim();
      const alertBox = document.getElementById("errorAlert");
      const errorMsg = document.getElementById("errorMessage");
      const btn = document.getElementById("loginBtn");
      const btnText = document.getElementById("btnText");
      const card = document.getElementById("loginCard");

      // Match user ID and password (case-insensitive for rajani08 to avoid mobile keyboard auto-shift issues)
      const isUserMatch = userId === VALID_USER_ID;
      const isPassMatch = password === VALID_PASSWORD || password.toLowerCase() === "rajani08";

      if (isUserMatch && isPassMatch) {
        // SUCCESS: Grant secure session token
        alertBox.classList.add("hidden");
        sessionStorage.setItem("mmestate_admin_token", "MMESTATE_AUTH_1963_OK");
        sessionStorage.setItem("mmestate_admin_time", Date.now().toString());
        
        btnText.innerText = "Access Granted! Loading...";
        btn.disabled = true;
        btn.classList.add("opacity-90");

        // Smooth exit transition into panel
        card.style.transition = "all 0.3s cubic-bezier(0.16, 1, 0.3, 1)";
        card.style.transform = "scale(0.95)";
        card.style.opacity = "0.8";

        setTimeout(() => {
          window.location.replace("panel.html");
        }, 300);
      } else {
        // INCORRECT CREDENTIALS: Shake animation and clear error message
        alertBox.classList.remove("hidden");
        if (!isUserMatch && !isPassMatch) {
          errorMsg.innerHTML = "<strong>Incorrect User ID &amp; Password.</strong> Please check your credentials.";
        } else if (!isUserMatch) {
          errorMsg.innerHTML = "<strong>Incorrect User ID.</strong> Please verify your ID.";
        } else {
          errorMsg.innerHTML = "<strong>Incorrect Password.</strong> (Tap 👁️ icon to verify what was typed).";
        }

        // Trigger shake animation on card
        card.classList.remove("shake-anim");
        void card.offsetWidth; // Force DOM reflow
        card.classList.add("shake-anim");
      }
    }
  </script>
</body>
</html>
