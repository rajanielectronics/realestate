<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" name="viewport"/>
  <title>M&MESTATE - Admin Login</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <style>
    /* iOS & Tablet input zoom prevention: input font must be at least 16px */
    @media screen and (max-width: 1024px) {
      input, select, textarea {
        font-size: 16px !important;
        min-height: 48px !important;
      }
      button {
        min-height: 48px !important;
      }
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#F5F3FF',
              600: '#7C3AED',
              700: '#6D28D9',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-purple-950 to-slate-900 font-sans text-slate-800 antialiased">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl border border-slate-100 p-8">
    <!-- Brand Header -->
    <div class="flex flex-col items-center mb-5">
      <div class="w-14 h-14 rounded-2xl bg-brand-600 flex items-center justify-center text-white font-extrabold text-2xl shadow-lg shadow-brand-500/30 mb-3">
        M
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-slate-900">M&amp;MESTATE Admin</h1>
      <p class="text-xs text-slate-500 mt-1">Please sign in to access property management</p>
    </div>

    <!-- Quick Credentials Helper Box (One-Click Auto-Fill) -->
    <div class="mb-5 flex items-center justify-between text-xs bg-purple-50 border border-purple-200 rounded-xl px-3.5 py-2.5 text-purple-900">
      <div class="flex items-center gap-1.5 flex-wrap">
        <span class="font-bold text-slate-700">Login:</span>
        <span class="font-mono font-bold bg-white px-2 py-0.5 rounded border border-purple-200 text-purple-800">1963</span>
        <span class="text-slate-400">/</span>
        <span class="font-mono font-bold bg-white px-2 py-0.5 rounded border border-purple-200 text-purple-800">Rajani08</span>
      </div>
      <button type="button" onclick="quickFillCredentials()" class="px-2.5 py-1 bg-purple-600 hover:bg-purple-700 text-white rounded-lg font-bold text-[11px] shadow-xs transition shrink-0 ml-2">
        Auto-Fill
      </button>
    </div>

    <!-- ERROR MESSAGE BOX (Displays when wrong password or user ID is entered) -->
    <div id="errorAlert" class="hidden mb-5 p-3.5 bg-rose-50 border-2 border-rose-300 rounded-xl text-rose-700 text-xs font-semibold flex items-center gap-2.5">
      <svg class="w-5 h-5 shrink-0 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span id="errorMessage">Incorrect User ID or Password. Please check and try again!</span>
    </div>

    <!-- Login Form (autocomplete off to prevent Google Password Manager hijack) -->
    <form id="loginForm" autocomplete="off" class="space-y-4" onsubmit="doLogin(event)">
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">User ID</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <input id="userIdInput" type="text" autocomplete="off" spellcheck="false" data-lpignore="true" required placeholder="Enter User ID (1963)" class="w-full pl-10 pr-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-600 focus:border-brand-600 outline-none transition"/>
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">Password</label>
          <span class="text-[11px] text-slate-400">Click 👁️ to see characters</span>
        </div>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <!-- autocomplete="new-password" prevents Chrome Compromised Password popups -->
          <input id="passwordInput" type="password" autocomplete="new-password" spellcheck="false" data-lpignore="true" required placeholder="Enter Password (Rajani08)" class="w-full pl-10 pr-11 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-600 focus:border-brand-600 outline-none transition"/>
          <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-brand-600 focus:outline-none transition" title="Show or Hide Password">
            <span id="eyeIcon" class="text-sm">👁️</span>
          </button>
        </div>
      </div>

      <button id="loginBtn" type="submit" class="w-full mt-2 py-3 px-4 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm rounded-xl shadow-md shadow-brand-500/25 transition flex items-center justify-center gap-2 cursor-pointer">
        <span>Sign In to Admin Panel</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-slate-100 text-center">
      <a href="index.html" class="text-xs text-slate-400 hover:text-slate-600 transition flex items-center justify-center gap-1">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Back to Public Website
      </a>
    </div>
  </div>

  <script>
    const VALID_USER_ID = "1963";
    const VALID_PASSWORD = "Rajani08";

    // Auto-login URL query bypass: e.g. admin.html?autologin=1 or admin.html?auth=1963
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get("autologin") === "1" || urlParams.get("auth") === "1963") {
      sessionStorage.setItem("mmestate_admin_authenticated", "true");
      localStorage.setItem("mmestate_admin_authenticated", "true");
      window.location.replace("panel.html");
    }

    // If already logged in, redirect straight to panel.html
    if (sessionStorage.getItem("mmestate_admin_authenticated") === "true" || localStorage.getItem("mmestate_admin_authenticated") === "true") {
      window.location.replace("panel.html");
    }

    function togglePasswordVisibility() {
      const input = document.getElementById("passwordInput");
      const icon = document.getElementById("eyeIcon");
      if (input.type === "password") {
        input.type = "text";
        icon.innerText = "🙈";
      } else {
        input.type = "password";
        icon.innerText = "👁️";
      }
    }

    function quickFillCredentials() {
      document.getElementById("userIdInput").value = "1963";
      const passInput = document.getElementById("passwordInput");
      passInput.value = "Rajani08";
      passInput.type = "text"; // show it so user can confirm
      document.getElementById("eyeIcon").innerText = "🙈";
      document.getElementById("errorAlert").classList.add("hidden");
    }

    function doLogin(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      const userId = (document.getElementById("userIdInput").value || "").trim();
      const password = (document.getElementById("passwordInput").value || "").trim();
      const alertBox = document.getElementById("errorAlert");
      const errorMsg = document.getElementById("errorMessage");
      const btn = document.getElementById("loginBtn");

      // Flexible check: accepts exact "Rajani08" or lowercase "rajani08" to avoid mobile capitalization mismatches
      const isUserMatch = userId === VALID_USER_ID;
      const isPassMatch = password === VALID_PASSWORD || password.toLowerCase() === "rajani08";

      if (isUserMatch && isPassMatch) {
        // SUCCESS
        alertBox.classList.add("hidden");
        sessionStorage.setItem("mmestate_admin_authenticated", "true");
        localStorage.setItem("mmestate_admin_authenticated", "true");
        btn.innerHTML = `<span>Signing In...</span>`;
        btn.disabled = true;

        // Redirect to the management panel
        setTimeout(() => {
          window.location.replace("panel.html");
        }, 150);
      } else {
        // INCORRECT CREDENTIALS - MENTION CLEARLY
        alertBox.classList.remove("hidden");
        if (!isUserMatch && !isPassMatch) {
          errorMsg.innerHTML = "<strong>Wrong Credentials!</strong> Both User ID and Password are incorrect. (Correct: 1963 / Rajani08)";
        } else if (!isUserMatch) {
          errorMsg.innerHTML = "<strong>Wrong User ID!</strong> Expected <strong>1963</strong>. Please check and try again.";
        } else {
          errorMsg.innerHTML = "<strong>Wrong Password!</strong> Expected <strong>Rajani08</strong>. (Click 👁️ to see what you typed)";
        }

        // Visual shake animation
        const card = document.querySelector(".w-full.max-w-md");
        if (card) {
          card.classList.add("ring-2", "ring-rose-400");
          setTimeout(() => card.classList.remove("ring-2", "ring-rose-400"), 600);
        }
      }
    }
  </script>
</body>
</html>
